# `files` — serve i binari che il backend PRODUCE ma NON serve.
#
# Perché questo container esiste, che è la parte non ovvia.
#
# Il backend compone URL assoluti verso i propri file:
#
#     ${DOMAIN_URL}/images/<nome>      locandine caricate
#     ${DOMAIN_URL}/tickets/<nome>     PDF dei biglietti
#     ${DOMAIN_URL}/receipts/<nome>    ricevute
#     ${DOMAIN_URL}/exports/<nome>     export degli eventi
#
# (`src/utils/adapters/upload.ts`, `TicketDocumentService`, `OrderDocumentService`,
# `EventExportService`.) Ma `src/server.ts` registra `@fastify/static` su
# `public/` SOLO quando `NODE_ENV === "development"`:
#
#     if (process.env.NODE_ENV !== "development") { return; }
#
# In produzione, quindi, il backend GENERA quei file e poi risponde 404 agli
# URL che ha appena scritto nelle email e nei PDF. Non è un difetto di questo
# stack: è un buco fra l'applicazione e il suo esercizio, e va colmato da una
# delle due parti. Colmarlo qui — un nginx sul volume, in sola lettura — invece
# che nel backend ha tre ragioni:
#
#   1. non richiede di toccare il codice, quindi non lega la messa in linea a
#      un rilascio dell'applicazione;
#   2. i file statici non passano dal processo Node, che così non spende
#      event-loop a spedire PDF;
#   3. il volume è montato **ro**: qualunque cosa vada storta qui, i biglietti
#      già emessi non si possono corrompere da questo lato.
#
# ⚠️ Se un domani il backend tornasse a servire `public/` anche in produzione,
# ci sarebbero DUE strade verso gli stessi file: a quel punto questo container
# va tolto, non lasciato «per sicurezza».
#
# ⚠️ Si espongono i QUATTRO prefissi che il backend pubblica, e non `/`.
# `public/assets/fonts` contiene i Poppins usati per generare i PDF lato
# server: servono al backend, non al browser, e non c'è motivo di pubblicarli.
# Nessuno dei quattro prefissi collide con una rotta di `www` (eventi, accedi,
# profilo, conferma-email) o di `app` (events, registrations, reports/exports…):
# verificato sui rispettivi `app.routes.ts` il 18/08/2026.

server {
    listen 80;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;

    # Bersaglio dell'healthcheck del container. Non tocca il volume: deve dire
    # «nginx risponde», non «il volume ha dei file dentro» — un volume vuoto,
    # il giorno prima del primo caricamento, è lo stato normale.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # I quattro prefissi pubblici. `=404` e non un fallback: un file assente
    # deve dirlo. Un fallback su index.html darebbe **200 con dell'HTML** a chi
    # ha chiesto un PDF, e il sintomo («il biglietto non si apre») non
    # nominerebbe la causa.
    location ~ ^/(images|tickets|receipts|exports)/ {
        try_files $uri =404;

        # I nomi dei file sono generati e non si ripetono: una volta scritto,
        # un biglietto non cambia più. La cache può essere lunga.
        add_header Cache-Control "public, max-age=604800";

        # I PDF dei biglietti si aprono da un link in una email, spesso in un
        # webmail su un'altra origine. Senza questa intestazione il browser
        # blocca la risorsa quando la pagina che la include è cross-origin —
        # ed è la stessa che il backend imposta quando serve `public/` in
        # sviluppo, quindi i due comportamenti restano allineati.
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    # Tutto il resto non è pubblico. Compreso `/assets/`, che esiste nel volume.
    location / {
        return 404;
    }
}

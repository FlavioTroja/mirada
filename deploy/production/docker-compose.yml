# Mirada Tango — stack di PRODUZIONE. Le ragioni di ogni scelta: docker-compose.md
name: mirada-production

services:

  db:
    image: postgres:18-alpine
    container_name: mirada-production-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?manca .env di stack — vedi README}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?manca .env di stack — vedi README}"
      POSTGRES_DB: "${POSTGRES_DB:-mirada}"
      TZ: "${TZ:-Europe/Rome}"
      PGTZ: "${TZ:-Europe/Rome}"
    volumes:
      # ⚠️ Su /var/lib/postgresql, NON su /var/lib/postgresql/data.
      # Le immagini postgres 18+ tengono i dati in una sottocartella col numero
      # di versione (/var/lib/postgresql/18/docker), perché è ciò che rende
      # possibile un `pg_upgrade --link` senza attraversare un punto di mount.
      # Montando il volume sul vecchio percorso il container si RIFIUTA di
      # partire — «there appears to be PostgreSQL data in /var/lib/postgresql/data
      # (unused mount/volume)» — e riparte in ciclo. Misurato qui il 18/08/2026.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-mirada}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    image: ghcr.io/flaviotroja/mirada/backend:${IMAGE_TAG:-production}
    container_name: mirada-production-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "5000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mirada}?schema=public&connection_limit=20"
      TZ: "${TZ:-Europe/Rome}"
      TIMEZONE: "${TZ:-Europe/Rome}"
    volumes:
      - public:/app/public
    networks:
      - internal
      - proxy_network
    logging: *logging

  app:
    image: ghcr.io/flaviotroja/mirada/app:${IMAGE_TAG:-production}
    container_name: mirada-production-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - proxy_network
    logging: *logging

  www:
    image: ghcr.io/flaviotroja/mirada/www:${IMAGE_TAG:-production}
    container_name: mirada-production-www
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      TZ: "${TZ:-Europe/Rome}"
    ports:
      - "127.0.0.1:8082:4000"
    networks:
      - proxy_network
    logging: *logging

  files:
    image: nginx:1.27-alpine
    container_name: mirada-production-files
    restart: unless-stopped
    volumes:
      - public:/usr/share/nginx/html:ro
      - ./files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8083:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - proxy_network
    logging: *logging

  backup:
    build:
      context: ../../oz-backup-s3/backup-s3
      dockerfile: Dockerfile
      args:
        PG_VERSION: "18"
    image: mirada/backup-s3:pg18
    container_name: mirada-production-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./s3-backup/.env
    environment:
      TZ: "${TZ:-Europe/Rome}"
      ENABLE_PG_BACKUP: "yes"
      ENABLE_MYSQL_BACKUP: "no"
      ENABLE_MONGO_BACKUP: "no"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-mirada}"
    volumes:
      - ./s3-backup/logs:/var/log
    networks:
      - internal
    logging: *logging

networks:

  internal:
    name: mirada-production-internal
    driver: bridge

  proxy_network:
    name: proxy_network
    external: true

volumes:

  pgdata:
    name: mirada-production-pgdata

  public:
    name: mirada-production-public

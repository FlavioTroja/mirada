# auth.mirada.dance — Authentik, il fornitore di identità.
#
# Sul server questo file vive in /home/manager/orch/nginx/auth.mirada.dance.conf.
# La copia versionata è questa.
#
#   [internet] → proxy (questo file: TLS e smistamento) → authentik-server:9000
#
# ⚠️ Qui NON si include snippets/mirada-backend.conf. Authentik è un servizio a
# sé: nessuna rotta di questo nome deve finire sul backend di mirada, e in
# particolare /api qui è l'API DI AUTHENTIK, non quella dell'applicazione.


server {
    listen 80;
    listen [::]:80;

    server_name auth.mirada.dance;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name auth.mirada.dance;

    # Lo STESSO certificato degli altri nomi: uno solo, esteso con --expand a
    # coprire mirada.dance, www, app e auth. Un certificato per nome
    # significherebbe quattro rinnovi da sorvegliare invece di uno.
    ssl_certificate     /etc/letsencrypt/live/mirada.dance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirada.dance/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    # Una pagina di accesso non ha niente da fare in un motore di ricerca.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # I flussi di Authentik portano molto stato nei cookie di sessione, e il
    # ritorno da Google arriva con parametri lunghi. Con i valori predefiniti
    # di nginx si prende un 502 proprio in mezzo al percorso d'accesso, dove è
    # più difficile da leggere: sembra Authentik rotto, è nginx che tronca.
    client_max_body_size 32m;
    proxy_buffers        8 32k;
    proxy_buffer_size    32k;
    large_client_header_buffers 4 32k;

    # Il DNS interno di Docker. ⚠️ Serve QUI e non si eredita da altrove: negli
    # altri domini arriva con snippets/mirada-backend.conf, che questo vhost non
    # include di proposito. Senza, l'upstream in variabile qui sotto fa fallire
    # l'avvio di nginx con «no resolver defined to resolve authentik-server».
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        # L'upstream in una variabile, così nginx risolve il nome A OGNI
        # RICHIESTA invece che una volta all'avvio: se il container di Authentik
        # viene ricreato e cambia indirizzo, il proxy non resta a puntare al
        # vecchio finché qualcuno non lo ricarica.
        set $authentik authentik-server;
        proxy_pass http://$authentik:9000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # L'interfaccia di amministrazione e i flussi usano i WebSocket.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }
}

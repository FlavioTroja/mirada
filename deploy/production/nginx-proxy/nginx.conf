# Configurazione BASE del container `proxy`. Vive in
# /home/manager/orch/nginx/nginx.conf, che il proxy monta su /etc/nginx.
#
# Qui NON ci sono domini: ci sono le cose che valgono per tutti, e gli
# `include` dei blocchi `server`, uno per dominio. Aggiungere un dominio
# significa mettere un file accanto a questo e aggiungere una riga in fondo.

user  nginx;
# `auto` = un worker per core. Su questa macchina sono pochi, e fissarlo a mano
# vorrebbe dire rimetterci mano se la macchina cresce.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # `$host` e non `$server_name` nel log: dice quale nome ha CHIESTO il
    # client, che è l'informazione utile quando un dominio finisce nel blocco
    # `server` sbagliato.
    log_format  main  '$remote_addr - $remote_user [$time_local] "$host" "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Il numero di versione non si regala a chi sonda.
    server_tokens off;

    # Locandine e allegati caricati dal gestionale passano da qui. Il default
    # di 1M rifiuterebbe una foto da telefono con un 413 che il frontend
    # mostra come un errore generico.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # Necessaria a inoltrare i WebSocket: traduce l'intestazione `Upgrade`
    # della richiesta nel `Connection` giusto. Senza, `proxy_set_header
    # Connection $connection_upgrade` userebbe una variabile inesistente e
    # nginx non partirebbe affatto.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Le pagine che NON devono finire nei motori di ricerca ────────────────
    #
    # `www` dichiara `noIndex` su alcune pagine, e SeoService scrive il
    # corrispondente <meta name="robots">. Ma quel meta arriva a un crawler solo
    # se la pagina è resa dal SERVER, e tre rotte sono `RenderMode.Client`
    # (app.routes.server.ts): accesso, profilo e checkout. Per loro il crawler
    # riceve il guscio statico, che il meta non ce l'ha — misurato il
    # 18/08/2026 sul build di produzione.
    #
    # `X-Robots-Tag` fa lo stesso lavoro a livello di INTESTAZIONE HTTP, quindi
    # non dipende da cosa c'è nel corpo né da chi l'ha reso. Google, Bing e
    # DuckDuckGo la rispettano.
    #
    # ⚠️ `conferma-email` NON è in questa lista, ed è deliberato: quella rotta è
    # resa dal server e il suo `noindex` arriva già (verificato). Aggiungerla
    # qui non farebbe danno, ma direbbe il falso sul perché la lista esiste.
    #
    # Il valore vuoto del `default` è ciò che tiene l'intestazione FUORI da
    # tutte le altre pagine: nginx non aggiunge un `add_header` il cui valore si
    # risolve nella stringa vuota. Senza questo accorgimento servirebbe una
    # `location` per rotta, ognuna con la propria copia del `proxy_pass`.
    map $uri $robots_tag {
        default                     "";
        ~^/accedi                   "noindex, nofollow";
        ~^/profilo                  "noindex, nofollow";
        ~^/eventi/[^/]+/iscrizione  "noindex, nofollow";
    }

    # ── Il blocco che assorbe tutto il resto ─────────────────────────────────
    # `default_server` risponde a chi arriva con un nome che non conosciamo
    # (scansioni, vecchi DNS, l'IP nudo). Senza, nginx userebbe il PRIMO blocco
    # `server` come predefinito: chiunque sondasse l'IP riceverebbe il sito
    # pubblico, e nei log comparirebbe come traffico legittimo.
    #
    # 444 chiude la connessione senza rispondere: non è una cortesia, è il modo
    # di non spendere banda per una richiesta che non ci riguarda.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # L'eccezione: la sfida ACME deve passare anche da qui, perché al
        # PRIMO rilascio di un dominio il suo blocco `server` non esiste ancora.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 444;
        }
    }

    # ── I domini ─────────────────────────────────────────────────────────────
    # Un file per dominio. La copia versionata di ciascuno sta in
    # deploy/production/nginx-proxy/ del repository: sul server non c'è storia,
    # e un blocco modificato a mano e poi dimenticato è il modo classico di
    # perdere un pomeriggio.
    include /etc/nginx/mirada.dance.conf;
    include /etc/nginx/app.mirada.dance.conf;
}

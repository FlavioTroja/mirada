# mirada.dance — il sito pubblico (`www`, Angular con SSR) e, sotto lo stesso
# nome, l'API e i file del backend.
#
# Sul server questo file vive in /home/manager/orch/nginx/mirada.dance.conf ed è
# incluso da nginx.conf. Questa copia nel repository è la VERITÀ VERSIONATA:
# chi lo cambia lo cambia qui, e poi lo riporta là.
#
#   [internet] → proxy (questo file: TLS e smistamento)
#                  ├─ /api, /docs, /ws  → mirada-production-backend:5000
#                  ├─ /images /tickets
#                  │  /receipts /exports → mirada-production-files:80
#                  └─ tutto il resto     → mirada-production-www:4000
#
# ⚠️ `www` NON è nginx con dei file dentro: è un processo Node che RENDERIZZA
# l'HTML a ogni richiesta. Un 502 qui non significa «i file non ci sono», ma
# «il processo non risponde», e si guarda in `docker compose logs www`.


# ─────────────────────────────────────────────────────────────────────────────
# HTTP — solo sfida ACME e redirect permanente su HTTPS
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;

    server_name mirada.dance www.mirada.dance;

    # Deve restare raggiungibile IN CHIARO: è il webroot che certbot usa per la
    # validazione. Se finisse nel redirect qui sotto, il rinnovo fallirebbe —
    # e fallirebbe in silenzio, perché certbot riprova ogni 12 ore e nessuno
    # legge i suoi log finché il certificato non scade.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mirada.dance$request_uri;
    }
}


# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — www.mirada.dance → mirada.dance
# ─────────────────────────────────────────────────────────────────────────────
# Un contenuto, un indirizzo. Due nomi che servono le stesse pagine dividono le
# sessioni, i cookie e — cosa che si paga più tardi — l'indicizzazione.
# Il redirect avviene DOPO la terminazione TLS, quindi questo blocco ha bisogno
# del certificato tanto quanto l'altro: il nome è nello stesso certificato.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.mirada.dance;

    ssl_certificate     /etc/letsencrypt/live/mirada.dance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirada.dance/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    return 301 https://mirada.dance$request_uri;
}


# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — il sito
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name mirada.dance;

    ssl_certificate     /etc/letsencrypt/live/mirada.dance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirada.dance/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    # Tiene accesso, profilo e checkout fuori dai motori di ricerca. La mappa
    # `$robots_tag` sta in nginx.conf, col perché per esteso; qui vale la regola
    # che la rende sicura:
    #
    # ⚠️ STA A LIVELLO `server`, NON dentro una `location`. In nginx gli
    # `add_header` si ereditano SOLO se il livello figlio non ne ha di propri:
    # metterne uno dentro `location /` cancellerebbe quelli che arrivano da
    # ssl.conf — HSTS, X-Content-Type-Options e Referrer-Policy — su tutte le
    # pagine del sito. Un'intestazione aggiunta che ne toglie tre, e nessun
    # errore che lo dica.
    add_header X-Robots-Tag $robots_tag always;

    # API, /docs, /ws e i file generati dal backend. Una sola definizione,
    # condivisa con app.mirada.dance. Porta con sé il `resolver`, che vale per
    # tutto il blocco: va incluso PRIMA della `location /` qui sotto.
    include /etc/nginx/snippets/mirada-backend.conf;

    # ── Tutto il resto: il sito renderizzato lato server ────────────────────
    location / {
        # Il bersaglio è il CONTAINER NAME dichiarato nel compose, non il nome
        # del servizio: entrambi si risolvono su `proxy_network`, ma il
        # container_name è unico sulla macchina, mentre `www` è un nome
        # generico che un altro stack potrebbe rivendicare.
        set $www mirada-production-www;
        proxy_pass http://$www:4000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }
}

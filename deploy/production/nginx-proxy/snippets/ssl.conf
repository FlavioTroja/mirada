# I parametri TLS, scritti una volta e inclusi da ogni blocco `server` in HTTPS.
#
# Non contiene `ssl_certificate`: quello cambia da dominio a dominio e resta nel
# file del dominio, dove si vede. Qui c'è solo ciò che deve essere IDENTICO
# ovunque — perché un blocco che per distrazione ammette TLSv1.0 abbassa la
# sicurezza dell'intera macchina, e non se ne accorgerebbe nessuno.

ssl_protocols TLSv1.2 TLSv1.3;
# `off` è la raccomandazione corrente: con TLS 1.3 la lista di cifrari è
# irrilevante, e su 1.2 i client moderni scelgono meglio del server.
ssl_prefer_server_ciphers off;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
# I ticket di sessione senza rotazione delle chiavi indeboliscono la forward
# secrecy: con la cache condivisa qui sopra non servono.
ssl_session_tickets off;

# ⚠️ NIENTE `ssl_stapling`, e non è una dimenticanza.
# Let's Encrypt ha smesso di inserire l'URL del responder OCSP nei certificati
# (i suoi certificati non ne hanno più), quindi la direttiva è inerte e nginx
# la segnala a OGNI caricamento:
#
#     nginx: [warn] "ssl_stapling" ignored, no OCSP responder URL in the
#     certificate "/etc/letsencrypt/live/mirada.dance/fullchain.pem"
#
# Misurato qui il 18/08/2026. Lasciarla costerebbe un avviso a ogni `nginx -t`
# e a ogni reload — cioè in ogni deploy — e un avviso che compare sempre è un
# avviso che si smette di leggere, compreso quello vero il giorno che arriva.

# ⚠️ HSTS dice al browser «da qui in poi, per un anno, SOLO https». È una
# promessa che non si può ritirare in fretta: un browser che l'ha ricevuta
# rifiuterà http anche se domani il certificato scade. Con il rinnovo
# automatico di certbot è la scelta giusta; va saputo prima, non dopo.
# `includeSubDomains` NON c'è di proposito: vincolerebbe anche sottodomini
# futuri che potrebbero non avere certificato.
add_header Strict-Transport-Security "max-age=31536000" always;

# Il browser non deve indovinare il tipo di contenuto: è il modo in cui un file
# caricato dagli utenti diventa uno script eseguito.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

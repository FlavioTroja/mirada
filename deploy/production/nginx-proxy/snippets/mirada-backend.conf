# Le rotte che vanno al BACKEND e ai suoi file, scritte UNA VOLTA e incluse dai
# blocchi `server` di entrambi i domini (mirada.dance e app.mirada.dance).
#
# Perché un frammento condiviso invece di copiarle due volte: due copie delle
# stesse regole divergono al primo ritocco fatto su una sola delle due, e il
# sintomo — una chiamata che si comporta diversamente a seconda del dominio da
# cui è entrata — non nomina la causa.
#
# Perché il backend risponde sotto ENTRAMBI i domini: `app/src/.../api.client.ts`
# e l'equivalente di `www` chiamano l'API con percorsi RELATIVI
# (`API_PREFIX = '/api'`). Ogni frontend parla quindi con la propria origine, e
# il CORS non entra in gioco — il che conta, perché con NODE_ENV=production il
# backend registra CORS con una lista di origini vuota.
#
# Va incluso PRIMA della `location /` del dominio: il `resolver` qui sotto vale
# per l'intero blocco `server`, e serve anche a quella.

# Risolutore DNS interno di Docker. Serve perché gli upstream qui sotto sono
# scritti in una VARIABILE, e questa è la differenza che tiene in piedi il resto:
#
#   - con l'host LETTERALE, nginx lo risolve UNA VOLTA, al caricamento della
#     configurazione. Due conseguenze: (1) se il container non esiste ancora —
#     al primo allestimento, o dopo un `docker compose down` — `nginx -t`
#     FALLISCE con «host not found in upstream» e il proxy NON RIPARTE,
#     portandosi dietro tutti gli altri domini; (2) dopo ogni deploy il
#     container è nuovo e ha un IP nuovo, mentre nginx tiene il vecchio: 502 sul
#     dominio pubblico con l'applicazione sanissima dietro, e nei log
#     dell'applicazione non c'è niente, perché la richiesta non ci arriva.
#
#   - con l'host in una variabile, nginx risolve a OGNI richiesta (con la cache
#     di `valid=`). Un container assente diventa un 502 onesto invece di un
#     proxy che non parte, e un IP cambiato si corregge da sé entro 30 secondi.
#
# `ipv6=off` perché la rete Docker non ha IPv6 e senza questo nginx tenta
# comunque una AAAA a ogni richiesta.
resolver 127.0.0.11 valid=30s ipv6=off;

# ── L'API ────────────────────────────────────────────────────────────────────
# `^~` e non un prefisso semplice: in nginx le location con espressione
# regolare battono i prefissi, e un eventuale blocco `~*` per le estensioni
# statiche intercetterebbe una chiamata API che finisse in `.js` o simili,
# cercandola su disco. `^~` ferma la ricerca sui regex.
#
# `proxy_pass` SENZA parte URI: l'URI passa intero, e il backend espone già le
# sue rotte sotto /api (`prefix: "/api"` in server.ts). Scrivere
# `http://$backend:5000/` taglierebbe il prefisso e darebbe 404 su tutto.
location ^~ /api/ {
    set $backend mirada-production-backend;
    proxy_pass http://$backend:5000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Senza questa, l'applicazione dietro crede di essere servita in chiaro: la
    # terminazione TLS avviene QUI, e ciò che parte da qui in poi è http.
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 15s;
    proxy_send_timeout    120s;
    # Generoso: la generazione dei PDF dei biglietti e gli export degli eventi
    # sono sincroni, e su un evento con molte iscrizioni superano il default di
    # 60s. Un 504 qui sembrerebbe un guasto del backend mentre sta lavorando.
    proxy_read_timeout    300s;
}

# ── Il documento OpenAPI ─────────────────────────────────────────────────────
# È anche la sola GET ANONIMA che risponde 200: tutto ciò che sta sotto /api
# risponde 401, che per una sonda è indistinguibile da un guasto. Averla qui
# rende diagnosticabile dall'esterno esattamente ciò che l'healthcheck del
# container verifica da dentro.
location ^~ /docs {
    set $backend_docs mirada-production-backend;
    proxy_pass http://$backend_docs:5000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Il canale in tempo reale ─────────────────────────────────────────────────
# Il client apre `wss://<host>/ws/<wsCode>` (app/src/app/core/realtime/
# realtime.service.ts), mentre il server WebSocket è agganciato alla RADICE del
# backend. Il prefisso `/ws` va quindi TOLTO — è quello che in sviluppo fa il
# `pathRewrite` di `proxy.conf.json`.
#
# Si toglie con `rewrite … break` e non con lo slash finale di `proxy_pass`
# perché l'upstream è una variabile: con una variabile, la sostituzione
# automatica del prefisso non avviene, e `proxy_pass http://$ws:5000/` non
# taglierebbe un bel niente.
location ^~ /ws/ {
    set $ws mirada-production-backend;
    rewrite ^/ws/(.*)$ /$1 break;
    proxy_pass http://$ws:5000;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Un WebSocket sta zitto per minuti fra un evento e l'altro. Col default di
    # 60s nginx chiuderebbe la connessione a ogni pausa, e il client
    # riconnetterebbe di continuo: sembra instabilità di rete e non lo è.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
}

# ── I file che il backend genera ─────────────────────────────────────────────
# Locandine, biglietti, ricevute, export. Li serve il container `files`, un
# nginx montato in sola lettura sullo stesso volume del backend: il perché per
# esteso sta in deploy/production/files/nginx.conf — in breve, il backend
# GENERA quei file ma in produzione NON li serve (registra @fastify/static solo
# se NODE_ENV === "development"), quindi risponderebbe 404 agli URL che ha
# appena scritto dentro i PDF e le email.
#
# Stanno sotto ENTRAMBI i domini perché `www` li richiama con percorsi relativi
# (`/images/…`) mentre biglietti e ricevute portano l'URL assoluto costruito su
# DOMAIN_URL: in un modo o nell'altro devono rispondere ovunque.
location ~ ^/(images|tickets|receipts|exports)/ {
    set $files mirada-production-files;
    proxy_pass http://$files:80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # I PDF dei biglietti non sono piccoli e la connessione di chi li scarica
    # può essere lenta.
    proxy_read_timeout 120s;
}

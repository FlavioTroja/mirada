# app.mirada.dance — il gestionale (`app`, SPA Angular servita da nginx) e,
# sotto lo stesso nome, l'API e i file del backend.
#
# Sul server questo file vive in /home/manager/orch/nginx/app.mirada.dance.conf.
# La copia versionata è questa.
#
#   [internet] → proxy (questo file: TLS e smistamento)
#                  ├─ /api, /docs, /ws  → mirada-production-backend:5000
#                  ├─ /images /tickets
#                  │  /receipts /exports → mirada-production-files:80
#                  └─ tutto il resto     → mirada-production-app:80 (la SPA)
#
# ⚠️ Il fallback SPA (`try_files … /index.html`) NON sta qui: sta nell'nginx
# DENTRO l'immagine di `app` (app/docker/nginx.conf). Sono due nginx in fila, e
# ognuno fa una cosa sola — questo termina il TLS e smista, quello serve i file.


server {
    listen 80;
    listen [::]:80;

    server_name app.mirada.dance;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name app.mirada.dance;

    ssl_certificate     /etc/letsencrypt/live/mirada.dance/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirada.dance/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    # ⚠️ Il gestionale non va indicizzato: è un backoffice, non un sito.
    add_header X-Robots-Tag "noindex, nofollow" always;

    include /etc/nginx/snippets/mirada-backend.conf;

    location / {
        set $app mirada-production-app;
        proxy_pass http://$app:80;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout    60s;
    }
}

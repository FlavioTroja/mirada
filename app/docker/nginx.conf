# `app` — l'nginx DENTRO l'immagine della SPA. Serve solo i file del build.
#
# Finisce in /etc/nginx/conf.d/default.conf sostituendo quella di serie: è un
# blocco `server`, non un file completo — `http {}`, `events {}` e i
# `worker_processes` restano quelli di /etc/nginx/nginx.conf dell'immagine.
#
# ⚠️ QUI NON SI INOLTRA `/api`, ed è una scelta, non una dimenticanza.
# Lo smistamento verso il backend avviene UNA SOLA VOLTA, nel proxy di sistema
# (deploy/production/nginx-proxy/app.mirada.dance.conf). Se lo si rifacesse
# anche qui, tutto il traffico API dell'app passerebbe DENTRO questo container
# e un deploy della SPA interromperebbe anche l'API — che con la SPA non
# c'entra. E due strade verso la stessa API significano due insiemi di
# intestazioni e timeout, destinati a divergere al primo ritocco fatto su una
# sola delle due.
#
# Conseguenza da conoscere: `curl http://127.0.0.1:8081/api/...` sul server NON
# risponde. Quella porta serve a diagnosticare la SPA; per l'API si interroga
# il container del backend o il dominio.

server {
    listen 80;
    server_name _;

    # Il numero di versione di nginx non si regala a chi sonda.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Locandine e allegati caricati dal gestionale passano dal proxy, non da
    # qui; il limite resta comunque generoso rispetto al default di 1M.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- Asset con hash nel nome -------------------------------------------
    # Il build di produzione usa `outputHashing: "all"`: il nome cambia a ogni
    # contenuto diverso, quindi la cache può essere lunga e `immutable` — il
    # browser non rivalida nemmeno. Una versione nuova porta nomi nuovi.
    #
    # Niente `expires` insieme a questo `add_header`: `expires` emette un
    # `Cache-Control` PROPRIO, e la risposta ne porterebbe due. Con due
    # intestazioni uguali il comportamento dipende dal client.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- index.html: MAI in cache ------------------------------------------
    # È l'unico file col nome fisso, ed è quello che nomina gli asset hashati.
    # Se resta in cache, dopo un rilascio il browser chiede i chunk della
    # versione precedente, che non esistono più: pagina bianca, e nessun errore
    # che dica perché.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # --- Fallback SPA -------------------------------------------------------
    # Le rotte Angular non sono file: ogni percorso che non corrisponde a un
    # file torna `index.html`, altrimenti un ricaricamento su
    # `/events/12/sessions` darebbe 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!doctype html>
<!-- `data-theme` è scritto qui e non lasciato al solo `ThemeService`: fra il
     primo pixel e l'avvio di Angular passa qualche centinaio di millisecondi, e
     senza attributo quel tratto lo disegna il browser. `lang` è italiano perché
     l'applicazione lo è: lo leggono la sintesi vocale e la sillabazione. -->
<html lang="it" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Mirada Tango</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
